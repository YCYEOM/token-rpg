name: Publish to PyPI

# 릴리스를 발행할 때만 돈다. 토큰은 쓰지 않는다 —
# PyPI가 GitHub의 OIDC 신원을 직접 검증한다 (Trusted Publishing).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 자체 검증
        run: python token_rpg.py selftest
      - name: 빌드
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC 토큰 발급 권한. 이것만 있으면 된다.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
