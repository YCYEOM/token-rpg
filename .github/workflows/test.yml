name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 한 칸이 실패해도 나머지를 끝까지 본다 — 어느 OS 문제인지 알아야 한다
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26.04 로 넘어간다. setup-python 에는 26.04 용
        # Python 3.9 빌드가 없다(3.10 부터 있다) — 그대로 두면 이 칸이 설치 단계에서 실패한다.
        # 3.9 는 지원 하한이라 계속 봐야 하므로 24.04 에 묶어 둔다.
        # 26.04 칸은 넘어가기 전에 미리 보려고 둔다. ubuntu-latest 가 26.04 가 되면 지워도 된다.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-26.04
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # selftest 가 게임 화면(JS)을 node 로 실제로 돌린다 (tests/game_smoke.js).
      # CI 에서 node 가 없으면 selftest 가 실패한다 — 조용히 건너뛰지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 집계·병합 로직과 난이도/환생 곡선, 게임 화면을 검증한다.
      # CI에는 Claude Code 기록이 없다. 밸런스는 고정 영웅(BALANCE_HEROES)으로 본다.
      - run: python token_rpg.py selftest
      # 트레이는 윈도우 전용이지만 순수 로직(툴팁·단위)은 어디서나 검증한다
      - run: python token_rpg_tray.py --selftest
      - run: pip install . && token-rpg --version && token-rpg where
